# 로컬 개발·e2e 테스트용 DB. 기본 5432는 다른 프로젝트가 쓰고 있어 5433으로 열고,
# 비밀번호가 단순한 로컬 전용 DB라 이 PC(127.0.0.1)에서만 접속하게 한다
services:
  db:
    image: postgres:17-alpine
    container_name: zipboda-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zipboda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zipboda}
      POSTGRES_DB: ${POSTGRES_DB:-zipboda}
      # CI와 같은 로캘 정렬(ICU) — alpine 기본 정렬은 바이트 순이라 문자열 순서 버그가 로컬에서 안 보인다.
      # 볼륨을 처음 만들 때만 적용된다(기존 볼륨은 그대로)
      POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=en-US
    # 기본 64MB면 수만 건에서 동시 요청이 몰릴 때 병렬 쿼리가 공유 메모리를 못 얻어 실패한다(test/perf 측정에서 확인)
    shm_size: 256mb
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - zipboda-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zipboda} -d ${POSTGRES_DB:-zipboda}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  zipboda-pgdata:
