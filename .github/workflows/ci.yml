name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: zipboda
          POSTGRES_PASSWORD: zipboda
          POSTGRES_DB: zipboda_test
          # alpine(musl)의 기본 정렬은 바이트 순이라 운영 DB(glibc·ICU)와 문자열 순서가 다르다 —
          # 운영과 같은 로캘 정렬로 띄워 목록의 id 동순위 규칙(COLLATE "C")이 빠지면 e2e가 잡게 한다
          POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=en-US
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zipboda -d zipboda_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # CI 전용 일회용 DB라 비밀값이 아니다
      DATABASE_URL: postgresql://zipboda:zipboda@localhost:5432/zipboda_test?schema=public
      TEST_DATABASE_URL: postgresql://zipboda:zipboda@localhost:5432/zipboda_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma validate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:e2e
